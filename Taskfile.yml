# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  db:migrate:
    desc: Apply PostgreSQL schema and seed migrations
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:schema:
    desc: Apply PostgreSQL schema migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind schema

  db:migrate:seed:
    desc: Apply PostgreSQL seed migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind seed

  api:
    desc: Start Edge Platform server
    dir: server
    cmds:
      - go run ./cmd/api

  web:
    desc: Start Edge Platform web
    dir: web
    cmds:
      - npm run dev

  dev:
    desc: Migrate PostgreSQL and start server and web
    deps:
      - db:migrate
    cmds:
      - task --parallel api web

  backend:test:
    desc: Run server unit tests
    dir: server
    cmds:
      - go test ./...

  backend:check:
    desc: Run server tests and vet
    dir: server
    cmds:
      - go test ./...
      - go vet ./...

  backend:integration:
    desc: Run PostgreSQL integration tests
    dir: server
    cmds:
      - go test -tags=integration ./integration -run 'Edge|Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage' -count=1

  backend:mqtt-integration:
    desc: Run Mosquitto MQTT integration tests
    dir: server
    cmds:
      - go test -tags=integration ./integration -run '^(TestMosquittoFixture|TestMQTTRuntime)' -count=1 -timeout=10m

  m2:edge-acceptance:
    desc: Run the real PostgreSQL, Mosquitto, Cloud, and Edge Collector M2 acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m2-edge-acceptance.mjs
        msg: scripts/m2-edge-acceptance.mjs is not present; GitHub #19 has not been implemented yet
    cmds:
      - node scripts/m2-edge-acceptance.mjs

  m3:device-acceptance:
    desc: Run the real PostgreSQL, Mosquitto, Cloud, two Edge Collectors, and Modbus Device M3 acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m3-device-acceptance.mjs
        msg: scripts/m3-device-acceptance.mjs is not present; GitHub #24 has not been implemented yet
    cmds:
      - node scripts/m3-device-acceptance.mjs

  m4:datapoint-acceptance:
    desc: Run the real Collector -> raw snapshot -> DataPoint CurrentValue acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m4-datapoint-acceptance.mjs
        msg: scripts/m4-datapoint-acceptance.mjs is missing
      - sh: test -n "$M4_DEVICE_ID"
        msg: M4_DEVICE_ID must identify a Device discovered by the real M3 Collector setup
      - sh: test -n "$M4_CLOUD_URL"
        msg: M4_CLOUD_URL must point at the running Cloud Server
    cmds:
      - node scripts/m4-datapoint-acceptance.mjs

  m5:realtime-acceptance:
    desc: Run the real Collector -> PostgreSQL CurrentValue -> Cloud WebSocket acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m5-realtime-acceptance.mjs
        msg: scripts/m5-realtime-acceptance.mjs is missing
      - sh: test -f docs/acceptance/m5-realtime-currentvalue.md
        msg: docs/acceptance/m5-realtime-currentvalue.md is missing
    cmds:
      - node scripts/m5-realtime-acceptance.mjs

  m6:command-acceptance:
    desc: Run the real PostgreSQL, Mosquitto, Edge Collector, Modbus and Cloud Command M6 acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m6-command-acceptance.mjs
        msg: scripts/m6-command-acceptance.mjs is missing
      - sh: test -f docs/acceptance/m6-command.md
        msg: docs/acceptance/m6-command.md is missing
    cmds:
      - node scripts/m6-command-acceptance.mjs

  m8:hmi-acceptance:
    desc: Run the isolated real PostgreSQL, Mosquitto, Edge Collector, Modbus, Cloud and browser HMI acceptance
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f scripts/m8-hmi-acceptance.mjs
        msg: scripts/m8-hmi-acceptance.mjs is missing
      - sh: test -f docs/acceptance/m8-hmi.md
        msg: docs/acceptance/m8-hmi.md is missing
    cmds:
      - node scripts/m8-hmi-acceptance.mjs

  frontend:lint:
    desc: Run web lint
    dir: web
    cmds:
      - npm run lint

  frontend:build:
    desc: Build web
    dir: web
    cmds:
      - npm run build

  check:
    desc: Run server and web checks
    deps:
      - backend:check
      - frontend:lint
      - frontend:build

  test:
    desc: Run default test suite
    deps:
      - backend:test

  build:
    desc: Build server and web
    deps:
      - frontend:build
    dir: server
    cmds:
      - go build ./cmd/api ./cmd/migrate
