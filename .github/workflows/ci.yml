name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...
      - run: go vet ./...

  mqtt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Pull pinned Mosquitto image
        run: docker pull eclipse-mosquitto:2.0.22
      - name: Record Mosquitto image digest
        run: |
          digest="$(docker image inspect eclipse-mosquitto:2.0.22 --format '{{join .RepoDigests "\n"}}' | head -n 1)"
          if [[ "$digest" != *"@sha256:"* ]]; then
            echo "Mosquitto image has no content digest: $digest" >&2
            exit 1
          fi
          echo "Using Mosquitto image digest: $digest"
          {
            echo "### Mosquitto integration image"
            echo
            echo "\`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Run MQTT integration tests
        run: task backend:mqtt-integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
