# 复制为 configs/config.dev.yaml 后填写本地凭据；实际文件不提交 Git。
swagger:
  enabled: true

database:
  driver: postgres
  url: postgres://127.0.0.1:54329/edge_platform?sslmode=disable
  username: edge_platform
  password: change-me

jwt:
  secret: replace-with-a-random-local-development-jwt-secret

auth:
  login_guard:
    ip_max_attempts: 20
    username_max_attempts: 5

file:
  storage_root: /absolute/path/to/edge-platform/.data/uploads

log:
  level: debug
  format: text

# Enable after the MQTT Runtime and a local broker are available.
mqtt:
  enabled: false
  url: mqtt://127.0.0.1:1883
  protocol: mqtt5
  client_id: edge-platform-server-dev
  prefix: edge
  keepalive: 30s
  connect_timeout: 10s
  reconnect_min: 1s
  reconnect_max: 30s
  session_expiry: 24h
  max_payload_bytes: 1048576
  reliable_queue_size: 1024
  raw_queue_size: 256
  consumer_timeout: 5s
  shutdown_timeout: 10s
