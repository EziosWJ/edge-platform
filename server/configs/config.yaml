service:
  name: edge-platform-server

http:
  address: ":8099"
  trusted_proxies: []
  read_header_timeout: 10s
  read_timeout: 5m
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

swagger:
  enabled: false

cors:
  allowed_origins:
    - "*"
  allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed_headers: [Authorization, Content-Type, X-Request-ID]
  exposed_headers: [X-Request-ID]
  max_age: 12h
  allow_credentials: false

database:
  driver: postgres
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

jwt:
  issuer: edge-platform-server
  audience: edge-platform-web
  ttl: 2h

auth:
  login_guard:
    ip_window: 10m
    ip_max_attempts: 20
    username_window: 10m
    username_max_attempts: 5
    backoff_initial: 1s
    backoff_max: 30s
    lock_duration: 10m
    max_entries: 10000

log:
  level: info
  format: json
  add_source: false

# MQTT is intentionally disabled until a broker and the MQTT Runtime are
# configured. APP_MQTT__* environment variables override these values.
mqtt:
  enabled: false
  protocol: mqtt5
  client_id: edge-platform-server
  prefix: edge
  keepalive: 30s
  connect_timeout: 10s
  reconnect_min: 1s
  reconnect_max: 30s
  session_expiry: 24h
  max_payload_bytes: 1048576
  reliable_queue_size: 1024
  raw_queue_size: 256
  consumer_timeout: 5s
  shutdown_timeout: 10s
